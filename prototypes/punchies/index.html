<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Punchies Prototype</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #111;
        height: 100%;
        overflow: hidden;
        font-family: monospace;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #rotate {
        display: none;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          display: flex;
          position: fixed;
          inset: 0;
          align-items: center;
          justify-content: center;
          background: #111;
          color: #ccc;
          font-size: 18px;
          z-index: 10;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="rotate">Rotate your phone to landscape</div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>

<!doctype html><html><head><meta charset="utf-8"><title>Punchies rig review</title><style>body{background:#182136;color:white;font:16px sans-serif;margin:12px}button,select{padding:9px;margin:4px}canvas{max-width:100%}</style></head><body><h2>Blended leg motion — actual runtime Puppet</h2><select id="char"><option>marco</option><option>mia</option><option>bruno</option><option>tee</option><option>tyke</option><option>dragon</option><option>longan</option><option>captain</option></select><select id="skin"><option value="default">Default</option><option value="skin-marco-unique">Rising Star (Marco)</option><option value="skin-marco-mcclassic">McClassic (Marco)</option><option value="skin-mia-flaming-kunoichi">Flaming Kunoichi (Mia)</option></select><select id="facing"><option value="up">Up</option><option value="right">Right</option><option value="left">Left</option><option value="down">Down</option></select><select id="pose"><option>idle</option><option>guard</option><option>jab</option><option>cross</option><option>hook</option><option>uppercut</option></select><button id="legs">Hide head / torso / arms</button><button id="pause">Pause</button><p>Left: forward/back · middle: strafe · right: diagonal. Alternates walking and stopping. Use the facing and pose selectors to check registration.</p><div id="app"></div><script type="module">
import Phaser from 'phaser';
import {punchCfg} from '../prototypes/punchies/src/sim/character.ts';
import {Puppet} from '../prototypes/punchies/src/render/puppet.ts';
import {WalkMotion} from '../prototypes/punchies/src/render/legMotion.ts';
import {createSimState} from '../prototypes/punchies/src/sim/sim.ts';
const aliases=await fetch('/game-prototypes/prototypes/punchies/assets/loose/part-mirrors.json').then(r=>r.json());
const manifest=await fetch('/game-prototypes/prototypes/punchies/assets/manifest.json').then(r=>r.json());
let legs=false,paused=false,clock=0;document.querySelector('#legs').onclick=e=>{legs=!legs;e.target.textContent=legs?'Show full body':'Hide head / torso / arms';};document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause';};
class Review extends Phaser.Scene{
 preload(){for(const c of ['marco','mia','bruno','tee','tyke','dragon','longan','captain','marco_rising_star','marco_mcclassic','mia_flaming_kunoichi'])for(const p of ['head','torso','glove_left','glove_right','boot_left','boot_right','scarf','ponytail','ponytail_left','ponytail_right']){const key='part_'+c+'_'+p;if(!aliases[key]&&manifest.some(v=>v.path==='loose/'+key+'.webp'))this.load.image('punchies:'+key,'/game-prototypes/prototypes/punchies/assets/loose/'+key+'.webp');}}
 create(){for(const [key,a] of Object.entries(aliases)){if(!this.textures.exists('punchies:'+a.source))continue;const src=this.textures.get('punchies:'+a.source).getSourceImage(),canvas=document.createElement('canvas');canvas.width=src.width;canvas.height=src.height;const ctx=canvas.getContext('2d');ctx.translate(a.axis==='x'?src.width:0,a.axis==='y'?src.height:0);ctx.scale(a.axis==='x'?-1:1,a.axis==='y'?-1:1);ctx.drawImage(src,0,0);this.textures.addCanvas('punchies:'+key,canvas);}this.puppets=[0,1,2].map(()=>new Puppet(this));this.gaits=[0,1,2].map(()=>new WalkMotion());this.fighters=[0,1,2].map(()=>createSimState({fighters:[{},{}]}).fighters[0]);this.grid=this.add.graphics().setDepth(-1);this.grid.lineStyle(1,0x394663);for(let x=0;x<960;x+=20)this.grid.lineBetween(x,0,x,440);for(let y=0;y<440;y+=20)this.grid.lineBetween(0,y,960,y);['FORWARD / BACK','STRAFE','DIAGONAL'].forEach((v,i)=>this.add.text(160+i*320,35,v,{fontSize:'18px'}).setOrigin(.5));}
 update(_time,delta){if(!paused)clock+=Math.min(delta,40);const t=clock/1000,u=t%6,walk=u<2||u>=3&&u<5,sign=u<3?1:-1,dist=u<2?u*36:u<3?72:u<5?72-(u-3)*36:0;this.fighters.forEach((f,i)=>{f.char=document.querySelector('#char').value;const facing=document.querySelector('#facing').value;[f.fx,f.fy]=({up:[0,-1],right:[1,0],left:[-1,0],down:[0,1]})[facing];const pose=document.querySelector('#pose').value;f.guarding=pose==='guard';f.punch=pose==='idle'||pose==='guard'?null:{...punchCfg(f.char,pose),type:pose,hand:pose==='cross'?1:0,frame:punchCfg(f.char,pose).startup+punchCfg(f.char,pose).sourEarly,connected:false,whiffFrames:0};const dirs=[[0,-1],[1,0],[Math.SQRT1_2,-Math.SQRT1_2]],d=dirs[i];f.x=160+i*320+d[0]*dist;f.y=260+d[1]*dist;this.gaits[i].update(f,clock,.21);const g=this.gaits[i],k=3;this.puppets[i].draw({f,skin:document.querySelector('#skin').value,now:clock,k,alt:false,fists:[0,1].map(i=>{const side=i===0?1:-1,u=f.punch&&f.punch.hand===i?f.punch.reach*2:f.guarding?20*k:15*k,v=(f.guarding?9:15)*k*side;return{x:f.x+f.fx*u+f.fy*v,y:f.y+f.fy*u-f.fx*v}}),fistColors:[0,0],baseColor:0,walk:g.phase,stride:g.stride,vel:g.direction,flashHead:false,flashBody:false,flashColor:0,dodging:false,guarding:f.guarding,reviewLegsOnly:legs});});}
}
new Phaser.Game({type:Phaser.CANVAS,width:960,height:440,parent:'app',backgroundColor:'#182136',scene:Review});
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><title>Punchies rig review</title><style>body{background:#182136;color:white;font:16px sans-serif;margin:12px}button,select{padding:9px;margin:4px}canvas{max-width:100%}</style></head><body><h2>Isolated rig review — actual runtime Puppet</h2><select id="char"><option>marco</option><option>mia</option><option>bruno</option><option>tee</option><option>tyke</option><option>dragon</option><option>longan</option></select><select id="skin"><option value="default">Default</option><option value="skin-marco-unique">Rising Star (Marco)</option></select><button id="legs">Show full body</button><button id="pause">Pause</button><p>All panels face upward. Left: forward/back · middle: strafe · right: diagonal. Alternates walking and stopping. Head, torso and arms start hidden.</p><div id="app"></div><script type="module">
import Phaser from 'phaser';
import {Puppet} from '../prototypes/punchies/src/render/puppet.ts';
import {WalkMotion} from '../prototypes/punchies/src/render/legMotion.ts';
import {createSimState} from '../prototypes/punchies/src/sim/sim.ts';
const aliases=await fetch('/game-prototypes/prototypes/punchies/assets/loose/part-mirrors.json').then(r=>r.json());
let legs=true,paused=false,clock=0;document.querySelector('#legs').onclick=e=>{legs=!legs;e.target.textContent=legs?'Show full body':'Hide head / torso / arms';};document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause';};
class Review extends Phaser.Scene{
 preload(){for(const c of ['marco','mia','bruno','tee','tyke','dragon','longan','marco_rising_star'])for(const p of ['head','torso','glove_left','glove_right','boot_left','boot_right']){const key='part_'+c+'_'+p;if(!aliases[key])this.load.image('punchies:'+key,'/game-prototypes/prototypes/punchies/assets/loose/'+key+'.webp');}}
 create(){for(const [key,a] of Object.entries(aliases)){if(!this.textures.exists('punchies:'+a.source))continue;const src=this.textures.get('punchies:'+a.source).getSourceImage(),canvas=document.createElement('canvas');canvas.width=src.width;canvas.height=src.height;const ctx=canvas.getContext('2d');ctx.translate(a.axis==='x'?src.width:0,a.axis==='y'?src.height:0);ctx.scale(a.axis==='x'?-1:1,a.axis==='y'?-1:1);ctx.drawImage(src,0,0);this.textures.addCanvas('punchies:'+key,canvas);}this.puppets=[0,1,2].map(()=>new Puppet(this));this.gaits=[0,1,2].map(()=>new WalkMotion());this.fighters=[0,1,2].map(()=>createSimState({fighters:[{},{}]}).fighters[0]);this.grid=this.add.graphics().setDepth(-1);this.grid.lineStyle(1,0x394663);for(let x=0;x<960;x+=20)this.grid.lineBetween(x,0,x,440);for(let y=0;y<440;y+=20)this.grid.lineBetween(0,y,960,y);['FORWARD / BACK','STRAFE','DIAGONAL'].forEach((v,i)=>this.add.text(160+i*320,35,v,{fontSize:'18px'}).setOrigin(.5));}
 update(_time,delta){if(!paused)clock+=Math.min(delta,40);const t=clock/1000,u=t%6,walk=u<2||u>=3&&u<5,sign=u<3?1:-1,dist=u<2?u*36:u<3?72:u<5?72-(u-3)*36:0;this.fighters.forEach((f,i)=>{f.char=document.querySelector('#char').value;f.fx=0;f.fy=-1;const dirs=[[0,-1],[1,0],[Math.SQRT1_2,-Math.SQRT1_2]],d=dirs[i];f.x=160+i*320+d[0]*dist;f.y=260+d[1]*dist;this.gaits[i].update(f,clock,.21);const g=this.gaits[i],k=3;this.puppets[i].draw({f,skin:document.querySelector('#skin').value,now:clock,k,alt:false,fists:[{x:f.x-15*k,y:f.y-15*k},{x:f.x+15*k,y:f.y-15*k}],fistColors:[0,0],baseColor:0,walk:g.phase,stride:g.stride,vel:g.direction,flashHead:false,flashBody:false,flashColor:0,dodging:false,guarding:false,reviewLegsOnly:legs});});}
}
new Phaser.Game({type:Phaser.CANVAS,width:960,height:440,parent:'app',backgroundColor:'#182136',scene:Review});
</script></body></html>

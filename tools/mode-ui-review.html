<!doctype html><html><head><meta charset="utf-8"><title>Punchies mode UI review · mock saves</title><style>html,body{margin:0;background:#101b32;color:white;font:13px Arial}header{height:32px;display:flex;gap:8px;align-items:center}#app{height:calc(100vh - 32px);position:relative}canvas{max-height:100%}</style></head><body><header><span id="status">Loading · mock saves</span><select id="screen"><option>menu</option><option>entry</option><option>select</option><option>active</option><option>intermission</option><option>resume</option><option>defeat</option><option>incompatible</option><option>save-error</option></select><select id="lang"><option>en</option><option>zh</option><option>ja</option><option>ar</option><option>long</option></select><button id="show">Show case</button></header><div id="app"></div><script>const q=new URLSearchParams(location.search);for(const id of ['screen','lang'])document.getElementById(id).value=q.get(id)||document.getElementById(id).value;document.querySelector('#show').onclick=()=>location.search=new URLSearchParams({screen:document.querySelector('#screen').value,lang:document.querySelector('#lang').value}).toString();</script><script type="module" src="./mode-ui-review.ts"></script></body></html>

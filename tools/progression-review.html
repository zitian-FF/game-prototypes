<!doctype html><html><head><meta charset="utf-8"><title>Punchies progression review · mock saves</title><style>html,body{margin:0;background:#101b32;color:white;font:14px Arial}header{height:32px;display:flex;gap:10px;align-items:center}#app{height:calc(100vh - 32px);position:relative}#app canvas{max-height:100%}</style></head><body><header><span id="status">Loading · mock saves only</span><select id="state"><option>fresh</option><option>mid</option><option>max</option><option>result</option><option>levelup</option><option>capped</option><option>hud</option><option>intro</option></select><select id="lang"><option>en</option><option>ja</option><option>ko</option><option>zh</option><option>ar</option><option>long</option></select><button id="show">Show case</button></header><div id="app"></div><script>const q=new URLSearchParams(location.search);for(const id of ['state','lang'])document.getElementById(id).value=q.get(id)||document.getElementById(id).value;document.querySelector('#show').onclick=()=>location.search=new URLSearchParams({state:document.querySelector('#state').value,lang:document.querySelector('#lang').value}).toString();</script><script type="module" src="./progression-review.ts"></script></body></html>

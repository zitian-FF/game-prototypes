name: Deploy suits-mp to itch.io

on:
  push:
    branches: [main]
    paths:
      - 'prototypes/suits-mp/**'
      - 'scripts/generate-versions.js'
      - 'scripts/bump-version.js'
      - 'scripts/fetch-assets.js'
      - 'scripts/pack-assets.js'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/deploy-suits-mp-itch.yml'
  workflow_dispatch:

concurrency:
  group: itch-suits-mp
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # suits-mp's card art was uploaded to R2 under "Suits-of-Madness_assets.zip"
      # rather than the "<name>_assets.zip" convention scripts/fetch-assets.js
      # defaults to (see its optional 3rd-arg override), since that's the
      # object name it was actually uploaded under.
      - name: Get suits-mp art ETag
        id: suits-mp-etag
        run: |
          etag=$(curl -fsSI "https://pub-415572b047994ab8807f76b8462eda45.r2.dev/Suits-of-Madness_assets.zip" \
            | grep -i '^etag:' | sed -E 's/[Ee][Tt][Aa][Gg]: *"?([^"\r]*)"?.*/\1/')
          echo "etag=$etag" >> "$GITHUB_OUTPUT"

      - name: Cache suits-mp art
        uses: actions/cache@v4
        with:
          path: |
            .cache/suits-mp.etag
            prototypes/suits-mp/assets-src
          key: suits-mp-art-${{ steps.suits-mp-etag.outputs.etag }}

      - name: Fetch suits-mp assets
        run: npm run fetch:assets suits-mp Suits-of-Madness_assets.zip

      - name: Pack suits-mp assets
        run: npm run pack:assets suits-mp

      - name: Typecheck
        run: npm run typecheck

      # Bumps the deploy counter (see "Version stamping" in root CLAUDE.md)
      # in-place, without committing yet - the commit only happens after a
      # successful push to itch.io below, so a failed deploy doesn't burn a
      # version number.
      - name: Bump version stamp counter
        run: node scripts/bump-version.js suits-mp

      # itch.io serves each upload from a build-specific path, so asset URLs
      # must be relative rather than the "/game-prototypes/" absolute base
      # the Pages build uses. Overriding --base here does not touch the
      # Pages build or vite.config.ts.
      - name: Build (relative base for itch.io)
        run: npx vite build --base ./

      # dist/ contains the hub page and every prototype because Vite builds
      # all entry points together. Only suits-mp's page (and the shared
      # assets/ chunks it references) needs to ship to suits-mp's itch
      # project, so drop the rest. This also leaves exactly one HTML file
      # in the upload, which itch.io auto-selects as the played file.
      - name: Prune build to suits-mp only
        run: |
          rm -f dist/index.html
          rm -rf dist/prototypes/digger
          rm -rf dist/prototypes/suits
          rm -rf dist/prototypes/mp-console
          rm -rf dist/prototypes/mp-net

      - name: Set up butler
        uses: jdno/setup-butler@v1

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: butler push dist zitian-ff/suits-mp:html5

      - name: Commit version stamp bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prototypes/suits-mp/version.json
          if git diff --cached --quiet; then
            echo "No version bump to commit"
            exit 0
          fi
          git commit -m "Bump suits-mp version stamp counter"

          # Other prototypes' itch.io deploys can trigger on the same push
          # (they share root files like package.json in their own path
          # filters) and race this same commit-and-push step, so a plain
          # push can be rejected as non-fast-forward. Retry a few times
          # rather than losing the version bump silently.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), retrying..."
            sleep $((attempt * 3))
          done
          echo "Failed to push version stamp bump after retries" >&2
          exit 1

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      operation-c-counter: ${{ steps.operation-c-version.outputs.counter }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Stamp Operation C deployment
        id: operation-c-version
        run: |
          node scripts/bump-version.js operation-c
          counter=$(node -p "require('./prototypes/operation-c/version.json').counter")
          echo "counter=$counter" >> "$GITHUB_OUTPUT"

      # One block per prototype that has art in R2. Add a block here when a
      # new prototype gains an assets-src (see scripts/fetch-assets.js).
      - name: Get digger-legacy art ETag
        id: digger-legacy-etag
        run: |
          etag=$(curl -fsSI "https://pub-415572b047994ab8807f76b8462eda45.r2.dev/digger_assets.zip" \
            | grep -i '^etag:' | sed -E 's/[Ee][Tt][Aa][Gg]: *"?([^"\r]*)"?.*/\1/')
          echo "etag=$etag" >> "$GITHUB_OUTPUT"

      - name: Cache digger-legacy art
        uses: actions/cache@v4
        with:
          path: |
            .cache/digger-legacy.etag
            prototypes/digger-legacy/assets-src
          key: digger-legacy-art-${{ steps.digger-legacy-etag.outputs.etag }}

      # digger-legacy's art still lives in R2 under the old digger name.
      - name: Fetch digger-legacy assets
        run: npm run fetch:assets digger-legacy digger_assets.zip

      - name: Pack digger-legacy assets
        run: npm run pack:assets digger-legacy

      - name: Get suits-mp art ETag
        id: suits-mp-etag
        run: |
          etag=$(curl -fsSI "https://pub-415572b047994ab8807f76b8462eda45.r2.dev/suits-mp_assets.zip" \
            | grep -i '^etag:' | sed -E 's/[Ee][Tt][Aa][Gg]: *"?([^"\r]*)"?.*/\1/')
          echo "etag=$etag" >> "$GITHUB_OUTPUT"

      - name: Cache suits-mp art
        uses: actions/cache@v4
        with:
          path: |
            .cache/suits-mp.etag
            prototypes/suits-mp/assets-src
          key: suits-mp-art-${{ steps.suits-mp-etag.outputs.etag }}

      - name: Fetch suits-mp assets
        run: npm run fetch:assets suits-mp

      - name: Pack suits-mp assets
        run: npm run pack:assets suits-mp

      - name: Typecheck
        run: npm run typecheck

      - name: Verify Punchies tuning tool
        run: |
          node scripts/test-punchies-tuner.mjs
          node scripts/test-punchies-tuner-file.mjs

      - name: Build
        run: npm run build

      # Pin the reviewed gameplay source independently of staging infrastructure.
      - name: Read pinned Punchies staging commit
        id: staging
        run: echo "sha=$(cat .github/punchies-staging-ref)" >> "$GITHUB_OUTPUT"

      - name: Checkout isolated staging source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.staging.outputs.sha }}
          path: .staging-source

      - name: Build compact staging and verify focused flags
        working-directory: .staging-source
        env:
          VITE_PUNCHIES_RATING_URL: ''
        run: |
          git switch -c staging/punchies-super
          npm ci
          npm run build:packages
          node scripts/build-punchies-staging.mjs ../dist/staging/punchies --stage-only
          # Production review output is local QA evidence, not a public stage route.
          rm -rf ../dist/staging/production

      - name: Export Battleshield Godot game for the web
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/godot-4.3"
          mkdir -p "$tools" "$HOME/.local/share/godot/export_templates/4.3.stable" dist/battleshield
          base="https://github.com/godotengine/godot-builds/releases/download/4.3-stable"
          curl -fL --retry 3 "$base/Godot_v4.3-stable_linux.x86_64.zip" -o "$tools/editor.zip"
          curl -fL --retry 3 "$base/Godot_v4.3-stable_export_templates.tpz" -o "$tools/templates.tpz"
          unzip -q "$tools/editor.zip" -d "$tools"
          unzip -j -q "$tools/templates.tpz" 'templates/web_nothreads_release.zip' -d "$HOME/.local/share/godot/export_templates/4.3.stable"
          godot="$tools/Godot_v4.3-stable_linux.x86_64"
          chmod +x "$godot"
          "$godot" --headless --path godot/battleshield --editor --import
          "$godot" --headless --path godot/battleshield --export-release Web ../../dist/battleshield/index.html
          test -s dist/battleshield/index.html
          test -s dist/battleshield/index.wasm
          test -s dist/battleshield/index.pck

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record successful Operation C deploy counter
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Persist only the deployed prototype counter
        env:
          OPERATION_C_DEPLOY_COUNTER: ${{ needs.build.outputs.operation-c-counter }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const file = 'prototypes/operation-c/version.json';
          const value = JSON.parse(fs.readFileSync(file, 'utf8'));
          const deployed = Number(process.env.OPERATION_C_DEPLOY_COUNTER);
          if (!Number.isInteger(deployed) || deployed < 1) throw new Error('Invalid deployed counter');
          value.counter = Math.max(value.counter, deployed);
          fs.writeFileSync(file, JSON.stringify(value, null, 2) + '\n');
          JS
          if git diff --quiet -- prototypes/operation-c/version.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototypes/operation-c/version.json
          git commit -m 'Record Operation C deployment counter [skip ci]'
          git push origin HEAD:main

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # One block per prototype that has art in R2. Add a block here when a
      # new prototype gains an assets-src (see scripts/fetch-assets.js).
      - name: Get digger art ETag
        id: digger-etag
        run: |
          etag=$(curl -fsSI "https://pub-415572b047994ab8807f76b8462eda45.r2.dev/digger_assets.zip" \
            | grep -i '^etag:' | sed -E 's/[Ee][Tt][Aa][Gg]: *"?([^"\r]*)"?.*/\1/')
          echo "etag=$etag" >> "$GITHUB_OUTPUT"

      - name: Cache digger art
        uses: actions/cache@v4
        with:
          path: |
            .cache/digger.etag
            prototypes/digger/assets-src
          key: digger-art-${{ steps.digger-etag.outputs.etag }}

      - name: Fetch digger assets
        run: npm run fetch:assets digger

      - name: Pack digger assets
        run: npm run pack:assets digger

      # suits-mp's card art was uploaded to R2 under "Suits-of-Madness_assets.zip"
      # rather than the "<name>_assets.zip" convention scripts/fetch-assets.js
      # defaults to (see its optional 3rd-arg override), since that's the
      # object name it was actually uploaded under.
      - name: Get suits-mp art ETag
        id: suits-mp-etag
        run: |
          etag=$(curl -fsSI "https://pub-415572b047994ab8807f76b8462eda45.r2.dev/Suits-of-Madness_assets.zip" \
            | grep -i '^etag:' | sed -E 's/[Ee][Tt][Aa][Gg]: *"?([^"\r]*)"?.*/\1/')
          echo "etag=$etag" >> "$GITHUB_OUTPUT"

      - name: Cache suits-mp art
        uses: actions/cache@v4
        with:
          path: |
            .cache/suits-mp.etag
            prototypes/suits-mp/assets-src
          key: suits-mp-art-${{ steps.suits-mp-etag.outputs.etag }}

      - name: Fetch suits-mp assets
        run: npm run fetch:assets suits-mp Suits-of-Madness_assets.zip

      - name: Pack suits-mp assets
        run: npm run pack:assets suits-mp

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

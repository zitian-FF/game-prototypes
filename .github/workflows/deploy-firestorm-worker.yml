name: Deploy Firestorm Arena Worker

on:
  push:
    branches: [main]
    paths:
      - "prototypes/firestorm-arena/server/**"
      - "packages/arena-sim/**"
      - "packages/firestorm-net/**"
      - "prototypes/firestorm-arena/tune.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-firestorm-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestorm-arena-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Typecheck and build shared packages
        run: npm run typecheck

      - name: Check Cloudflare deployment secrets
        id: cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Worker deployment skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
          fi

      - name: Deploy to Cloudflare Workers
        if: steps.cloudflare.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.143.0"
          workingDirectory: prototypes/firestorm-arena/server
          command: deploy

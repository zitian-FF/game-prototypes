name: Deploy approved Punchies Beta analytics Worker
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact approved combined Beta analytics source
        required: true
        type: string
      owner_approved_sha:
        description: Repeat approved source SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: punchies-beta-analytics-worker
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: Validate source and bind the approved database
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          OWNER_SHA: ${{ inputs.owner_approved_sha }}
          D1_ID: ${{ vars.PUNCHIES_ANALYTICS_D1_ID }}
          REPORT_TOKEN: ${{ secrets.PUNCHIES_ANALYTICS_REPORT_TOKEN }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] && [ "$SOURCE_SHA" = "$OWNER_SHA" ] && [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ]
          [ -n "$REPORT_TOKEN" ] || { echo "Report secret is required"; exit 1; }
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='prototypes/punchies/analytics-server/wrangler.jsonc',config=JSON.parse(fs.readFileSync(file));
          if(!/^[a-f0-9]{8}-(?:[a-f0-9]{4}-){3}[a-f0-9]{12}$/.test(process.env.D1_ID||''))throw Error('Approved D1 UUID required');
          if(config.name!=='punchies-beta-analytics'||config.d1_databases.length!==1||config.d1_databases[0].binding!=='DB'||config.d1_databases[0].database_name!=='punchies-beta-analytics')throw Error('Unexpected Worker/DB target');
          config.d1_databases[0].database_id=process.env.D1_ID;
          fs.writeFileSync(file,JSON.stringify(config,null,2));
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/test-punchies-beta-analytics.mjs
      - run: npm run typecheck
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.143.0'
          command: d1 migrations apply punchies-beta-analytics --remote --config prototypes/punchies/analytics-server/wrangler.jsonc
      - name: Deploy dedicated Worker and private report secret
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.143.0'
          command: deploy --config prototypes/punchies/analytics-server/wrangler.jsonc
          secrets: REPORT_TOKEN
        env:
          REPORT_TOKEN: ${{ secrets.PUNCHIES_ANALYTICS_REPORT_TOKEN }}

name: Deploy Punchies Beta analytics Worker
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: punchies-beta-analytics-worker
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/test-punchies-beta-analytics.mjs
      - run: npm run typecheck
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.143.0'
          command: d1 migrations apply punchies-beta-analytics --remote --config prototypes/punchies/analytics-server/wrangler.jsonc
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.143.0'
          command: deploy --config prototypes/punchies/analytics-server/wrangler.jsonc

name: Deploy Punchies rating Worker
on:
  push:
    branches: [main]
    paths: ['prototypes/punchies/server/**', 'scripts/test-punchies-rating.mjs', '.github/workflows/deploy-punchies-rating.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: punchies-rating-worker
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/test-punchies-rating.mjs
      - run: npm run typecheck
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.143.0'
          command: deploy --config prototypes/punchies/server/wrangler.jsonc

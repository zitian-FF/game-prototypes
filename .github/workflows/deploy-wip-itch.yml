name: Deploy Current WIP to itch.io

# The "Current WIP" itch.io slot (the itch project formerly used for suits).
# Deploys whichever prototype is named in .github/wip-prototype. To point
# the slot at another prototype, change that file (and the hub link label
# in index.html).

on:
  push:
    branches: [main]
    paths:
      - '.github/wip-prototype'
      - 'prototypes/**'
      - 'scripts/generate-versions.js'
      - 'scripts/bump-version.js'
      - 'scripts/fetch-assets.js'
      - 'scripts/pack-assets.js'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/deploy-wip-itch.yml'
  workflow_dispatch:
    inputs:
      pull_translations:
        description: Download the translation sheet as CSV and pack it into this build (Punchies). Release builds always do this.
        type: boolean
        default: false

concurrency:
  group: itch-wip
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read WIP target
        id: target
        run: echo "name=$(tr -d '[:space:]' < .github/wip-prototype)" >> "$GITHUB_OUTPUT"

      # The path filter above has to cover every prototype since the target
      # is dynamic. Skip the deploy (and the version bump) when a push only
      # touched some other prototype.
      - name: Check whether this push affects the WIP target
        id: relevant
        env:
          BEFORE: ${{ github.event.before }}
          TARGET: ${{ steps.target.outputs.name }}
        run: |
          if [ "${{ github.event_name }}" != "push" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qvE '^prototypes/' \
            || git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -q "^prototypes/$TARGET/"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.relevant.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.relevant.outputs.run == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.relevant.outputs.run == 'true'
        run: npm run typecheck

      - name: Get Punchies art ETag
        if: steps.relevant.outputs.run == 'true' && steps.target.outputs.name == 'punchies'
        id: punchies-art
        run: |
          url="https://pub-415572b047994ab8807f76b8462eda45.r2.dev/punchies_assets.zip"
          status=$(curl -sS -o /dev/null -D /tmp/punchies-art-headers -w '%{http_code}' -I "$url")
          if [ "$status" = "404" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Punchies art absent; build procedural fallback"
          elif [ "$status" = "200" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            etag=$(awk 'tolower($1)=="etag:" {gsub(/[\r"]/, "", $2); print $2}' /tmp/punchies-art-headers)
            echo "etag=$etag" >> "$GITHUB_OUTPUT"
          else
            echo "Art endpoint returned HTTP $status" >&2; exit 1
          fi

      - name: Cache Punchies source art by ETag
        if: steps.punchies-art.outputs.available == 'true' && steps.punchies-art.outputs.etag != ''
        uses: actions/cache@v4
        with:
          path: |
            prototypes/punchies/assets-src
            .cache/punchies.etag
          key: punchies-art-${{ steps.punchies-art.outputs.etag }}

      - name: Fetch and pack Punchies art
        if: steps.punchies-art.outputs.available == 'true'
        run: |
          npm run fetch:assets punchies
          npm run pack:assets punchies

      - name: Fetch verified Punchies music
        if: steps.relevant.outputs.run == 'true' && steps.target.outputs.name == 'punchies'
        run: node scripts/fetch-punchies-music.mjs

      # Translations are built into the game, never fetched at runtime. A release build (TEST_BUILD is
      # false in prototypes/punchies/src/testBuild.ts) or a run started with "pull_translations" downloads
      # the reviewed Google Sheet as CSV and writes locales/*.json into the workspace before the tests and
      # the build, so they are packed with the game. The pulled files are not committed; open the "Pull
      # Punchies translations" workflow to freeze them into the repository. If the download fails, a
      # release build stops; a test build keeps the committed files.
      - name: Pull translations from the sheet into the build
        if: steps.relevant.outputs.run == 'true' && steps.target.outputs.name == 'punchies'
        env:
          I18N_SHEET_URL: ${{ vars.I18N_SHEET_URL }}
          REQUESTED: ${{ inputs.pull_translations }}
        run: |
          release=false
          grep -q 'TEST_BUILD = false' prototypes/punchies/src/testBuild.ts && release=true
          if [ "$release" != true ] && [ "$REQUESTED" != true ]; then echo "Using the committed translation files"; exit 0; fi
          if [ -z "$I18N_SHEET_URL" ]; then
            echo "::error::Set the I18N_SHEET_URL repository variable (the sheet's CSV address) to pack translations"
            [ "$release" = true ] && exit 1 || exit 0
          fi
          if node scripts/i18n-sheet.mjs pull && node scripts/i18n-sheet.mjs check; then
            echo "Packed translations from the sheet"
          else
            echo "::error::Could not pull translations from the sheet"
            if [ "$release" = true ]; then exit 1; fi
            git checkout -- prototypes/punchies/src/i18n/locales
            echo "Kept the committed translation files"
          fi

      - name: Verify Punchies audio and roster
        if: steps.relevant.outputs.run == 'true' && steps.target.outputs.name == 'punchies'
        run: |
          node scripts/test-punchies-audio.mjs
          node scripts/test-punchies-combat-audio.mjs
          node scripts/test-punchies-music.mjs
          node scripts/test-punchies-stingers.mjs
          node scripts/test-punchies-feedback.mjs
          node scripts/test-punchies-ui-input.mjs
          node scripts/test-punchies-input-layouts.mjs
          node scripts/test-punchies-game-menu.mjs
          node scripts/test-punchies-reward-reveal.mjs
          node scripts/test-punchies-roster.mjs
          node scripts/test-punchies-shop.mjs
          node scripts/test-punchies-progress.mjs
          node scripts/test-punchies-alias.mjs
          node scripts/test-punchies-starter-skins.mjs
          node scripts/test-punchies-material-masks.mjs
          node scripts/test-punchies-leg-motion.mjs
          node scripts/test-punchies-portal.mjs
          node scripts/verify-punchies-tune-guard.mjs
          node scripts/test-punchies-states.mjs
          node scripts/test-punchies-emergency.mjs
          node scripts/test-punchies-geometry.mjs
          node scripts/test-punchies-i18n.mjs
          node scripts/test-punchies-json-packing.mjs
          if [ "${{ steps.punchies-art.outputs.available }}" = "true" ]; then
            node scripts/test-punchies-asset-optimization.mjs
          fi

      # Bumps the target's deploy counter (see "Version stamping" in root
      # CLAUDE.md) without committing yet - committed only after a
      # successful push to itch.io, so a failed deploy doesn't burn a number.
      - name: Bump version stamp counter
        if: steps.relevant.outputs.run == 'true'
        run: node scripts/bump-version.js "${{ steps.target.outputs.name }}"

      - name: Build (relative base for itch.io)
        if: steps.relevant.outputs.run == 'true'
        run: npx vite build --base ./

      # Keep only the target prototype's page plus shared assets/, so the
      # upload has exactly one HTML file for itch.io to auto-select.
      - name: Prune build to the WIP target only
        if: steps.relevant.outputs.run == 'true'
        env:
          TARGET: ${{ steps.target.outputs.name }}
        run: |
          rm -f dist/index.html
          for d in dist/prototypes/*/; do
            [ "$(basename "$d")" = "$TARGET" ] || rm -rf "$d"
          done
          ls dist/prototypes

      - name: Enforce Punchies package budget
        if: steps.relevant.outputs.run == 'true' && steps.target.outputs.name == 'punchies'
        run: node scripts/check-punchies-budget.mjs

      - name: Set up butler
        if: steps.relevant.outputs.run == 'true'
        uses: jdno/setup-butler@v1

      - name: Push to itch.io
        if: steps.relevant.outputs.run == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: butler push dist zitian-ff/suits:html5

      - name: Commit version stamp bump
        if: steps.relevant.outputs.run == 'true'
        env:
          TARGET: ${{ steps.target.outputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "prototypes/$TARGET/version.json"
          if git diff --cached --quiet; then
            echo "No version bump to commit"
            exit 0
          fi
          git commit -m "Bump $TARGET version stamp counter"
          # Other itch deploys can race this push; retry on non-fast-forward.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), retrying..."
            sleep $((attempt * 3))
          done
          echo "Failed to push version stamp bump after retries" >&2
          exit 1

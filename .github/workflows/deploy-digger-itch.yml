name: Deploy digger to itch.io

on:
  push:
    branches: [main]
    paths:
      - 'prototypes/digger/**'
      - 'scripts/generate-versions.js'
      - 'scripts/bump-version.js'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/deploy-digger-itch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: itch-digger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Bumps the deploy counter (see "Version stamping" in root CLAUDE.md)
      # in place; it is committed only after a successful itch.io push.
      - name: Bump version stamp counter
        run: node scripts/bump-version.js digger

      # itch.io serves each upload from a build-specific path, so asset URLs
      # must be relative rather than the "/game-prototypes/" absolute base
      # the Pages build uses. Overriding --base here does not touch the
      # Pages build or vite.config.ts.
      - name: Build (relative base for itch.io)
        run: npx vite build --base ./

      # dist/ contains the hub page and both prototypes because Vite builds
      # all entry points together. Only digger's page (and the shared
      # assets/ chunks it references) needs to ship to digger's itch
      # project, so drop the rest. This also leaves exactly one HTML file
      # in the upload, which itch.io auto-selects as the played file.
      - name: Prune build to digger only
        run: |
          rm -f dist/index.html
          find dist/prototypes -mindepth 1 -maxdepth 1 ! -name digger -exec rm -rf {} +

      - name: Set up butler
        uses: jdno/setup-butler@v1

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: butler push dist zitian-ff/digger:html5

      - name: Commit version stamp bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prototypes/digger/version.json
          if git diff --cached --quiet; then
            echo "No version bump to commit"
            exit 0
          fi
          git commit -m "Bump digger version stamp counter"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), retrying..."
            sleep $((attempt * 3))
          done
          echo "Failed to push version stamp bump after retries" >&2
          exit 1
